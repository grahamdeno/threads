  <g fill="none" stroke-width="13" stroke-linecap="round">
    <path d="M30 62 C 50 42, 70 42, 90 62 S 130 82, 150 62" stroke="#D9A441"/>
    <path d="M30 92 C 50 72, 70 72, 90 92 S 130 112, 150 92" stroke="#5FA8A0"/>
    <path d="M30 122 C 50 102, 70 102, 90 122 S 130 142, 150 122" stroke="#E8ECEE"/>
  </g>
</svg>
